<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4A90D9">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <title>木村家 家計簿</title>
  <!-- ?v= は更新のたびに数字を上げる（ブラウザに古いファイルを使わせないため） -->
  <link rel="stylesheet" href="css/style.css?v=20260822d">
</head>
<body>

<!-- ============================================================
     LOGIN
============================================================ -->
<div id="login-screen" style="display:none">
  <div class="login-card">
    <h1>🏠 木村家 家計簿</h1>
    <p id="login-hint">パスワードを入力してください</p>
    <form id="login-form">
      <div class="form-group">
        <input type="password" id="pwd-input" class="form-control"
          placeholder="パスワード" autocomplete="current-password" required>
      </div>
      <div id="login-error" style="color:var(--danger);font-size:13px;margin-bottom:12px"></div>
      <button type="submit" class="btn btn-primary">ログイン</button>
    </form>
  </div>
</div>

<!-- ============================================================
     APP
============================================================ -->
<div id="app-screen">

  <header>
    <h1 id="header-title">家計簿</h1>
    <div class="header-icons">
      <button class="sync-badge hidden" id="sync-badge" onclick="syncNow()" title="未同期の記録を反映する">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 20h16"></path></svg>
        <span>未同期 <span id="sync-badge-count">0</span></span>
      </button>
      <select id="month-select" class="month-select-header" onchange="onMonthChange(this.value)">
      </select>
    </div>
  </header>

  <div class="main-content">

    <!-- DASHBOARD -->
    <div class="view" id="view-dashboard">
      <div class="card">
        <div class="section-title">今月の予算残高</div>
        <div id="budget-list"></div>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="view hidden" id="view-history">
      <div class="history-search-row">
        <div class="history-searchbox">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="history-search-input" placeholder="単語で検索" oninput="onHistorySearchInput(this.value)">
        </div>
        <button class="history-filter-btn" id="history-filter-btn" onclick="openHistoryFilterSheet()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"></circle><line x1="4" y1="12" x2="20" y2="12"></line><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"></circle><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="9" cy="18" r="2" fill="currentColor" stroke="none"></circle></svg>
          <span class="history-filter-dot hidden" id="history-filter-dot"></span>
        </button>
      </div>
      <div class="history-fade-mask" id="history-fade-mask"></div>
      <div id="history-list"></div>
    </div>

    <!-- SUMMARY -->
    <div class="view hidden" id="view-summary">
      <div class="summary-year-row">
        <select id="summary-year-select" class="summary-year-select" onchange="onSummaryYearChange(this.value)"></select>
      </div>
      <div id="summary-grid" class="summary-grid"></div>
    </div>

    <!-- CHART -->
    <div class="view hidden" id="view-chart">
      <div class="card">
        <div class="section-title">月次比較</div>
        <div class="chart-tabs">
          <button class="tab-btn active" data-mode="total" onclick="renderBarChart('total')">総支出</button>
          <button class="tab-btn" data-mode="category" onclick="renderBarChart('category')">カテゴリ別</button>
        </div>
        <div id="chart-container"></div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div class="view hidden" id="view-settings">
      <div class="card">
        <div class="section-title">月次予算の設定</div>
        <div id="budget-inputs"></div>
        <div class="budget-total-row" id="budget-total-row">
          <span class="budget-total-label">合計予算</span>
          <span class="budget-total-value" id="budget-total-value">¥0</span>
        </div>
        <button class="btn btn-primary mt-4" onclick="saveBudget()">予算を保存</button>
      </div>

      <div class="card">
        <div class="section-title">パスワード変更</div>
        <div class="form-group">
          <label class="form-label">現在のパスワード</label>
          <input type="password" id="old-pwd" class="form-control" placeholder="現在のパスワード">
        </div>
        <div class="form-group">
          <label class="form-label">新しいパスワード</label>
          <input type="password" id="new-pwd" class="form-control" placeholder="新しいパスワード">
        </div>
        <button class="btn btn-ghost" onclick="changePassword()">パスワードを変更</button>
      </div>

      <div class="card">
        <div class="section-title">アカウント</div>
        <div class="settings-item">
          <span class="settings-label">ログアウト</span>
          <button class="btn btn-ghost" style="width:auto;padding:8px 16px;font-size:13px"
            onclick="logout()">ログアウト</button>
        </div>
      </div>
    </div>

  </div><!-- /main-content -->

  <!-- FAB -->
  <button class="fab" id="fab" title="記録する">＋</button>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="dashboard">
      <img class="nav-icon" src="icons/home.png" alt="ホーム">
      <span>ホーム</span>
    </button>
    <button class="nav-btn" data-view="history">
      <img class="nav-icon" src="icons/history.png" alt="履歴">
      <span>履歴</span>
    </button>
    <button class="nav-btn" data-view="summary">
      <img class="nav-icon" src="icons/summary.png" alt="集計">
      <span>集計</span>
    </button>
    <button class="nav-btn" data-view="chart">
      <img class="nav-icon" src="icons/chart.png" alt="グラフ">
      <span>グラフ</span>
    </button>
    <button class="nav-btn" data-view="settings">
      <img class="nav-icon" src="icons/settings.png" alt="設定">
      <span>設定</span>
    </button>
  </nav>

</div><!-- /app-screen -->

<!-- ============================================================
     ENTRY MODAL
============================================================ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">支出を記録</div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- ============================================================
     HISTORY FILTER SHEET
============================================================ -->
<div class="modal-overlay" id="history-filter-overlay" onclick="if(event.target===this) closeHistoryFilterSheet()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="filter-section-title">カテゴリ</div>
    <div class="filter-cat-grid" id="filter-cat-grid"></div>
    <div class="filter-section-title">支払い方法</div>
    <div class="filter-chip-row" id="filter-payment-row"></div>
    <div class="filter-section-title">カード種類</div>
    <div class="filter-chip-row" id="filter-cardtype-row"></div>
    <div class="filter-actions">
      <button class="btn btn-ghost" onclick="resetHistoryFilter()">リセット</button>
      <button class="btn btn-primary" id="filter-apply-btn" onclick="applyHistoryFilter()">絞り込む</button>
    </div>
  </div>
</div>

<!-- SUMMARY ZOOM OVERLAY -->
<div class="summary-zoom-overlay" id="summary-zoom-overlay" onclick="closeSummaryZoom()">
  <div class="summary-zoom-card" id="summary-zoom-card" onclick="event.stopPropagation()">
    <button class="summary-zoom-close" onclick="closeSummaryZoom()">✕</button>
    <div id="summary-zoom-body"></div>
  </div>
</div>

<!-- ============================================================
     未同期の警告（5日以上同期されていないとき起動時に表示）
============================================================ -->
<div class="unsync-overlay" id="unsync-overlay">
  <div class="unsync-card">
    <div class="unsync-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M18.7 17.7A5 5 0 0 0 18 8h-1.3A8 8 0 0 0 6 5.3"></path><path d="M4.2 8.2A5 5 0 0 0 6 18h10"></path></svg>
    </div>
    <div class="unsync-title"><span id="unsync-days">5</span>日間同期されていません</div>
    <div class="unsync-desc">
      <span id="unsync-count-lead">0</span>件の記録がこの端末にだけあります。<br>スプレッドシートに反映しましょう。
    </div>
    <div class="unsync-info">
      <div class="unsync-info-row"><span>最後の同期</span><span id="unsync-last">-</span></div>
      <div class="unsync-info-row"><span>未同期の合計</span><span id="unsync-total">-</span></div>
    </div>
    <button class="btn btn-primary" onclick="syncFromDialog()">今すぐ同期する</button>
    <button class="unsync-later" onclick="closeUnsyncedDialog()">あとで</button>
  </div>
</div>

<!-- LOADING -->
<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- config.js は接続設定（GAS_URLのみ）。app.js より先に読み込む -->
<script src="js/config.js?v=20260822d"></script>
<script src="js/app.js?v=20260822d"></script>
</body>
</html>
